<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>မမအတွက် ဖြူ့ရဲ့ Little Care Surprise 🤍</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Noto Sans Myanmar","Myanmar Text",sans-serif;
  background:#050611;
  color:#fff;
}

body{
  touch-action:pan-y;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

.scene{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
  opacity:0;
  transform:translateY(25px) scale(.97);
  pointer-events:none;
  transition:opacity .65s ease,transform .65s ease;
  overflow-y:auto;
}

.scene.active{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}

.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.10),transparent 25%),
    radial-gradient(circle at 80% 30%,rgba(255,180,220,.12),transparent 25%),
    linear-gradient(180deg,#070817,#101329 55%,#090a16);
  z-index:-3;
}

.card{
  width:min(92vw,620px);
  max-height:88vh;
  overflow-y:auto;
  padding:30px 22px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:30px;
  background:rgba(255,255,255,.075);
  backdrop-filter:blur(15px);
  box-shadow:0 20px 70px rgba(0,0,0,.35);
  text-align:center;
  animation:float 4s ease-in-out infinite;
}

.card h1{
  font-size:clamp(28px,8vw,48px);
  line-height:1.3;
  margin-bottom:18px;
}

.card h2{
  font-size:clamp(23px,6vw,34px);
  line-height:1.45;
  margin-bottom:18px;
}

.card p{
  font-size:clamp(16px,4.2vw,20px);
  line-height:2;
  margin:8px 0;
  color:#fdfdfd;
}

.small{
  opacity:.85;
  font-size:14px!important;
}

button{
  border:0;
  padding:14px 20px;
  margin:8px 5px;
  border-radius:999px;
  color:#fff;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);
  font-size:16px;
  cursor:pointer;
  transition:.25s;
}

button:hover{
  transform:translateY(-3px) scale(1.03);
  background:rgba(255,255,255,.22);
}

button:active{
  transform:scale(.96);
}

.envelope{
  width:min(82vw,340px);
  height:220px;
  margin:25px auto;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:18px;
  background:linear-gradient(145deg,#fff,#f5dff0);
  color:#9d527b;
  box-shadow:0 20px 60px rgba(255,180,230,.25);
  cursor:pointer;
  overflow:hidden;
  animation:envelopeFloat 3s ease-in-out infinite;
}

.envelope:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-left:170px solid transparent;
  border-right:170px solid transparent;
  border-top:110px solid #ead0df;
}

.envelope span{
  position:relative;
  z-index:2;
  padding:20px;
  font-weight:bold;
  line-height:1.8;
}

.heart{
  position:fixed;
  font-size:22px;
  animation:heartUp 2.7s ease-out forwards;
  pointer-events:none;
  z-index:20;
}

.star{
  position:fixed;
  width:3px;
  height:3px;
  background:#fff;
  border-radius:50%;
  opacity:.7;
  animation:twinkle 2s infinite alternate;
  z-index:-1;
}

.confetti{
  position:fixed;
  width:8px;
  height:14px;
  top:-20px;
  z-index:30;
  animation:confettiFall 3.5s linear forwards;
}

.progress{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  z-index:50;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  transition:.3s;
}

.dot.active{
  width:18px;
  border-radius:20px;
  background:#fff;
}

.nextHint{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  opacity:.5;
  z-index:50;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

@keyframes envelopeFloat{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-10px) rotate(1deg)}
}

@keyframes twinkle{
  from{opacity:.2;transform:scale(.7)}
  to{opacity:1;transform:scale(1.4)}
}

@keyframes heartUp{
  0%{
    opacity:0;
    transform:translateY(0) scale(.6) rotate(0);
  }
  15%{opacity:1}
  100%{
    opacity:0;
    transform:translateY(-180px) scale(1.5) rotate(25deg);
  }
}

@keyframes confettiFall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

@media(max-width:480px){
  .scene{
    padding:15px;
  }

  .card{
    padding:25px 17px;
    border-radius:25px;
  }

  .card p{
    line-height:1.9;
  }
}
</style>
</head>

<body>

<div id="app">
  <div class="bg"></div>
  <div id="scenes"></div>
</div>

<div class="progress" id="progress"></div>
<div class="nextHint">Tap / Swipe ↑ ↓</div>

let current = 0;
let touchStartY = 0;

const scenesEl = document.getElementById("scenes");
const progressEl = document.getElementById("progress");

function createStars(){
  for(let i=0;i<80;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.animationDelay=(Math.random()*2)+"s";
    s.style.opacity=Math.random();
    document.body.appendChild(s);
  }
}

function buildScenes(){

  scenesEl.innerHTML="";

  scenes.forEach((scene,index)=>{

    const section=document.createElement("section");
    section.className="scene";
    section.dataset.index=index;

    let content="";

    if(scene.envelope){

      content=`
        <div class="card">
          <h2>💌 Surprise လေးတစ်ခုရှိတယ်…</h2>

          <div class="envelope" onclick="openEnvelope()">
            <span>
              မမ… ဒီနေ့အတွက်<br>
              မမမသိသေးတဲ့ Surprise လေးတစ်ခုရှိတယ် 🤍
            </span>
          </div>

          <p class="small">စာအိတ်လေးကို နှိပ်ကြည့်နော် 👀</p>
        </div>
      `;

    }else{

      content=`
        <div class="card">
          ${scene.title ? `<h2>${scene.title}</h2>` : ""}
          <div>${scene.text}</div>

          ${
            scene.buttons
            ?
            `
            <div style="margin-top:22px">
              <button onclick="answerYes()">🤍 ဟုတ်တယ် 🥺</button>
              <button onclick="answerYes()">😭 ဟုတ်တယ်လို့ပဲ ပြောရမယ် 🤍</button>
            </div>
            `
            :
            ""
          }

          ${
            scene.final
            ?
            `
            <div style="margin-top:22px">
              <button onclick="restart()">🔁 ပြန်ဖတ်မယ်</button>
            </div>
            `
            :
            ""
          }
        </div>
      `;
    }

    section.innerHTML=content;
    scenesEl.appendChild(section);
  });
}

function buildProgress(){

  progressEl.innerHTML="";

  scenes.forEach((_,i)=>{
    const dot=document.createElement("div");
    dot.className="dot";
    dot.onclick=()=>{
      current=i;
      showScene();
    };
    progressEl.appendChild(dot);
  });
}

function showScene(){

  const all=document.querySelectorAll(".scene");

  all.forEach((scene,i)=>{
    scene.classList.toggle("active",i===current);
  });

  document.querySelectorAll(".dot").forEach((dot,i)=>{
    dot.classList.toggle("active",i===current);
  });

  if(current===1){
    progressEl.style.opacity=".55";
  }else{
    progressEl.style.opacity="1";
  }
}

function nextScene(){

  if(current < scenes.length-1){
    current++;
    showScene();
    burstHearts();
  }
}

function previousScene(){

  if(current>0){
    current--;
    showScene();
  }
}

function openEnvelope(){

  burstHearts();
  confetti();

  setTimeout(()=>{
    nextScene();
  },500);
}

function answerYes(){

  burstHearts();
  confetti();

  current++;

  showScene();
}

function restart(){

  current=0;
  showScene();
}

function burstHearts(){

  const hearts=["🤍","♡","💗","💕","🫶🏻","🌷"];

  for(let i=0;i<10;i++){

    const h=document.createElement("div");

    h.className="heart";
    h.textContent=hearts[Math.floor(Math.random()*hearts.length)];

    h.style.left=(20+Math.random()*60)+"%";
    h.style.top=(55+Math.random()*20)+"%";

    h.style.animationDelay=(Math.random()*.4)+"s";

    document.body.appendChild(h);

    setTimeout(()=>{
      h.remove();
    },3000);
  }
}

function confetti(){

  for(let i=0;i<35;i++){

    const c=document.createElement("div");

    c.className="confetti";

    c.style.left=Math.random()*100+"%";
    c.style.animationDelay=Math.random()*1+"s";
    c.style.transform=`rotate(${Math.random()*360}deg)`;

    document.body.appendChild(c);

    setTimeout(()=>{
      c.remove();
    },4500);
  }
}

document.addEventListener("click",(e)=>{

  if(
    e.target.tagName==="BUTTON" ||
    e.target.closest(".envelope") ||
    e.target.closest(".progress")
  ){
    return;
  }

  nextScene();
});

document.addEventListener("touchstart",(e)=>{
  touchStartY=e.changedTouches[0].screenY;
},{passive:true});

document.addEventListener("touchend",(e)=>{

  const endY=e.changedTouches[0].screenY;
  const diff=touchStartY-endY;

  if(Math.abs(diff)>50){

    if(diff>0){
      nextScene();
    }else{
      previousScene();
    }
  }
},{passive:true});

document.addEventListener("keydown",(e)=>{

  if(e.key==="ArrowDown" || e.key==="ArrowRight"){
    nextScene();
  }

  if(e.key==="ArrowUp" || e.key==="ArrowLeft"){
    previousScene();
  }
});

createStars();
buildScenes();
buildProgress();
showScene();

</script>

</body>
</html>
